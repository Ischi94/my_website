title = "Gregor Mathes"
baseURL = "https://gregor-mathes.netlify.app/"
languageCode = "en"
defaultContentLanguage = "en"
enableRobotsTXT = true
enableGitInfo = false
disableKinds = ["taxonomy", "term"]
ignoreFiles = ["\\.Rmd$", "\\.Rmarkdown$", "_cache$", "\\.knit\\.md$", "\\.utf8\\.md$"]
[outputs]
home = ["HTML", "RSS"]
[permalinks]
post = "/:year/:month/:day/:slug/"
[markup.goldmark.renderer]
unsafe = true
[markup.highlight]
noClasses = false
[pagination]
pagerSize = 20
